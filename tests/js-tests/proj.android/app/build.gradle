import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.application'
apply from: project(':libaxmol').projectDir.toString() + "/../dsl/axmol.gradle"

// Resolve build profiles
def buildProfiles = AxmolUtils.resolveBuildProfiles(project)

android {
    def packageName = buildProfiles['packageName']
    def cmakeVer = buildProfiles['cmakeVer']
    def cmakeOptions = Eval.me(buildProfiles['cmakeOptions'])
    def minSdk = buildProfiles['minSdk']
    def targetSdk = buildProfiles['targetSdk']

    // Apply build profiles
    namespace = packageName
    compileSdk = targetSdk.toInteger()
    ndkVersion = buildProfiles['ndkVer']
    if(buildProfiles.containsKey('ndkPath')) {
        ndkPath = buildProfiles['ndkPath']
    }

    defaultConfig {
        applicationId packageName
        minSdkVersion minSdk
        targetSdkVersion targetSdk
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments = []
                arguments.addAll(cmakeOptions)
                arguments.add("-D_AX_ROOT=" + System.getProperty("AX_ROOT"))
                cppFlags "-frtti -fexceptions -fsigned-char"
            }
        }

        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters = __1K_ARCHS.split(':').collect{it as String}
        }

        multiDexEnabled true
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "build/assets"
    }

    externalNativeBuild {
        cmake {
            version = cmakeVer
            path "../../CMakeLists.txt"
        }
    }

    signingConfigs {
       release {
            if (project.hasProperty("KEY_STORE_FILE")) {
                storeFile file(KEY_STORE_FILE)
                storePassword KEY_STORE_PASSWORD
                keyAlias KEY_ALIAS
                keyPassword KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            proguardFile file(project(':libaxmol').projectDir.toString() + '/proguard-rules.pro')
            if (project.hasProperty("KEY_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    aaptOptions {
       noCompress 'mp3','ogg','wav','mp4','ttf','ttc','otf'
    }

    buildFeatures {
        aidl = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libaxmol')

    def appcompat_ver = buildProfiles['appcompat']
    implementation "androidx.appcompat:appcompat:$appcompat_ver"
}

AxmolUtils.setupCopyAssets(project)

// The asset merger strips .gz and decompresses it. Legacy texture tests load
// both foo.pvr and foo.pvr.gz by name and expect the original bytes of each.
abstract class PackagePvrTextures extends Sync {
    // Sync tracks the merged input through from(). AGP consumes the output property.
    @Internal abstract DirectoryProperty getMergedAssets()
    @OutputDirectory abstract DirectoryProperty getPackagedAssets()
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    // CMake generates SharedLoader.java, which AppActivity imports.
    def variantName = variant.name.capitalize()
    def nativeBuild = "externalNativeBuild${variantName}"
    variant.configureJavaCompileTask { it.dependsOn(nativeBuild) }

    def content = layout.projectDirectory.dir('../../Content')
    def textures = tasks.register("package${variantName}PvrTextures", PackagePvrTextures) {
        from(mergedAssets)
        from(content) { include '**/*.pvr.gz' }
        into(packagedAssets)
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
    variant.artifacts.use(textures)
        .wiredWithDirectories({ it.mergedAssets }, { it.packagedAssets })
        .toTransform(SingleArtifact.ASSETS.INSTANCE)
}
